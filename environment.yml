# Conda environment for running swir-cgan from a local clone:
#
#   conda env create -f environment.yml
#   conda activate swir-cgan
#
# PyTorch comes from conda-forge, which picks a CUDA or CPU build to match the
# machine, so pip does not install it again.
name: swir-cgan
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pytorch>=2.4
  - numpy
  - scipy
  - rasterio
  - tqdm
  - pip
  - pip:
      - -e .
