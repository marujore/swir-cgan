[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swir-cgan"
dynamic = ["version"]
description = "Synthetic SWIR bands for CBERS-4, CBERS-4A and AMAZONIA-1 WFI imagery."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["remote sensing", "WFI", "CBERS-4", "CBERS-4A", "AMAZONIA-1", "SWIR", "GAN", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "rasterio",
    "scipy",
    "torch>=2.4",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swir-cgan = "swir_cgan.cli:main"

[project.urls]
Homepage = "https://github.com/marujore/swir-cgan"
Issues = "https://github.com/marujore/swir-cgan/issues"

[tool.setuptools]
packages = ["swir_cgan"]

[tool.setuptools.dynamic]
version = {attr = "swir_cgan.__version__"}

# The .pth checkpoints (Git LFS) are NOT shipped in the wheel (PyPI limits files
# to 100 MB); they are downloaded on first use. See swir_cgan/weights.py.
[tool.setuptools.exclude-package-data]
swir_cgan = ["weights/*.pth"]
